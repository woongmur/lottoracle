name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python -m lottoracle --version
          python -m lottoracle fortune --birth 1990-05-21 --name 테스트 --hour 4
          python -m lottoracle recommend --offline --seed 1 -n 2
