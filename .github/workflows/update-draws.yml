name: update draws

# 로또 추첨은 매주 토요일 20:35(KST). 당첨번호 검색은 추첨 직후 토요일 밤에 몰리므로
# 그 시간에 여러 번 확인한다. 번호만 먼저 나오고 당첨금·배출점이 늦게 붙는 경우가 있어
# 뒤의 실행들이 빈 곳을 채운다(새로 받은 것이 없으면 커밋·배포하지 않는다).
# 정각은 GitHub 예약 실행이 몰려 늦어지기 쉬워 7분·37분에 둔다.
on:
  schedule:
    - cron: "7 12 * * 6"      # KST 토 21:07 — 번호
    - cron: "7 13 * * 6"      # KST 토 22:07 — 번호·당첨금
    - cron: "37 14 * * 6"     # KST 토 23:37
    - cron: "0 18 * * 6"      # KST 일 03:00 — 놓친 것 다시
    - cron: "7 3 * * 0"       # KST 일 12:07 — 배출점 늦게 나온 경우
    - cron: "7 0 * * 1"       # KST 월 09:07 — 마지막 확인
  workflow_dispatch:
    inputs:
      store_backfill:
        description: "배출점을 최근 N회차까지 채운다 (0이면 새 회차만)"
        default: "0"
      prize_backfill:
        description: "당첨 현황이 빠진 회차를 최대 N개 채운다 (0이면 안 함)"
        default: "0"

permissions:
  contents: write
  actions: write     # 갱신 후 배포 워크플로를 직접 부른다
  issues: write      # 실패하면 이슈로 알린다

# 일본 로또 갱신(update-jp)과 같은 브랜치에 푸시한다. 겹치지 않게 줄 세운다.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 새 회차 받기
        id: fetch
        run: |
          latest() { python3 -c "from lottoracle import data; d=data.load_draws(data.DEFAULT_CACHE); print(max(x.no for x in d))"; }
          before=$(latest)
          python3 -m lottoracle fetch
          after=$(latest)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "새 회차: $before → $after"
          # 회차가 그대로여도 최신 회차의 당첨금이 이번에 채워졌을 수 있다. 바뀐 게 없으면 git 이 거른다.
          cp data/draws.json web/data/draws.json

      # 받은 회차는 건너뛰므로 최근 3회만 보면 된다. 발표 전이라 비어 있던 회차는
      # 받은 것으로 적지 않아서(fetch_stores.py) 다음 실행 때 다시 받는다.
      - name: 당첨 배출점 수집 (최근 회차 + 요청 시 과거 채우기)
        run: |
          if [ "${{ inputs.store_backfill || 0 }}" != "0" ]; then
            python3 tools/fetch_stores.py --recent "${{ inputs.store_backfill }}"
          else
            python3 tools/fetch_stores.py --recent 3
          fi

      # 회차 목록의 '1등 N명 · 1게임당 M원' 은 미리 받아 둔 값으로 그린다.
      # 로컬에서 몰아 부르면 동행복권이 연결을 끊으므로 여기서 나눠 채운다.
      - name: 당첨 현황 채우기 (요청 시)
        if: inputs.prize_backfill != '' && inputs.prize_backfill != '0'
        run: |
          python3 tools/backfill_prizes.py --limit "${{ inputs.prize_backfill }}" --delay 1.2
          cp data/draws.json web/data/draws.json

      - name: 골든 데이터 재생성 (회차가 늘면 통계도 바뀐다)
        if: steps.fetch.outputs.before != steps.fetch.outputs.after
        run: python3 tools/gen_golden.py

      - name: 테스트로 확인
        run: |
          python3 -m unittest discover -s tests
          cd web && npm test

      - name: 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ web/data/ web/test/golden/
          git diff --cached --quiet && { echo "바뀐 것이 없습니다."; exit 0; }
          git commit -m "data: ${{ steps.fetch.outputs.after }}회차까지 갱신 (회차·배출점·당첨현황)"
          git pull --rebase
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 한 푸시는 다른 워크플로(배포)를 깨우지 않는다.
      # workflow_dispatch 는 예외라서 여기서 직접 부른다. 바뀐 게 없으면 배포도 안 한다.
      - name: 배포 부르기
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"

      # 9월 초부터 6주 동안 이 워크플로가 실패하는 줄 아무도 몰랐다. Actions 탭을
      # 열어 봐야만 보이는 실패는 없는 것과 같아서, 저장소 이슈로 띄운다.
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="로또 회차 자동 갱신 실패"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "다시 실패했습니다: $RUN_URL"
          else
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n\n%s' \
              "주간 회차 갱신이 실패했습니다. 고칠 때까지 사이트의 회차·배출점 데이터가 멈춰 있습니다." \
              "로그: $RUN_URL" \
              "동행복권 응답이 바뀌었거나, 테스트가 실패한 경우입니다. 고친 뒤 이 이슈를 닫아 주세요.")"
          fi
