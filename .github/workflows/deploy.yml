name: deploy web

on:
  push:
    branches: [claude/lottery-number-prediction-6ncujl]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일만 모은다 (테스트·골든 데이터는 뺀다)
        run: |
          mkdir -p dist
          cp -r web/src web/data dist/
          cp web/public/* dist/
          cp web/index.html web/manifest.webmanifest web/sw.js web/icon.svg web/icon-192.png web/icon-512.png dist/
          find dist -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
