name: deploy web

on:
  push:
    branches: [claude/lottery-number-prediction-6ncujl]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일만 모은다 (테스트·골든 데이터는 뺀다)
        run: |
          mkdir -p dist
          cp -r web/src web/data dist/
          cp web/public/* dist/
          cp web/index.html web/manifest.webmanifest web/sw.js web/icon.svg web/icon-192.png web/icon-512.png dist/
          # 서비스워커 캐시 이름에 커밋 해시를 새긴다. 이게 있어야 배포한 것이
          # 재방문자에게도 닿는다 (캐시 이름이 그대로면 예전 파일이 계속 나간다).
          sed -i "s/__BUILD__/${GITHUB_SHA:0:12}/" dist/sw.js
          grep -m1 'const VERSION' dist/sw.js
          # robots.txt·sitemap.xml 은 절대 주소가 필요하다. 사용자 지정 도메인이
          # 있으면 그것을, 없으면 github.io 주소를 쓴다.
          if [ -s dist/CNAME ]; then BASE="https://$(head -n1 dist/CNAME | tr -d '[:space:]')";
          else BASE="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"; fi
          echo "사이트 주소: $BASE"
          sed -i "s#__BASE__#${BASE}#g" dist/robots.txt dist/sitemap.xml
          sed -i "s#__BASE__#${BASE}#g" dist/index.html
          find dist -type f | sort
      # 첫 배포 전에 저장소 Settings → Pages → Source 를 "GitHub Actions" 로
      # 한 번 켜 둬야 한다. enablement: true 로 워크플로가 대신 켜게 해 봤지만
      # 사이트 '생성' API 는 admin 권한이 필요해 GITHUB_TOKEN 으로는 막힌다
      # (Resource not accessible by integration). PAT 를 넣지 않는 한 수동이다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
